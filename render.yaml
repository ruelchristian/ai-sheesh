databases:
  - name: cortex-db
    plan: free
    databaseName: cortex
    user: cortex

services:
  - type: web
    name: cortex
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cortex-db
          property: connectionString
