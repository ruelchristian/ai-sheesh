<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Cortex — Skills &amp; Tools Library</title>
<style>
:root{color-scheme:dark;--bg:#09090b;--card:#111113;--tx:#fafafa;--mu:#a1a1aa;--bd:#27272a;--ac:#fafafa;--onac:#18181b;--chip:#27272a;--gh:#6e7681;--site:#60a5fa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:1100px;margin:0 auto;padding:36px 16px 64px}
h1{font-size:1.9rem;margin:0 0 6px;font-weight:700;letter-spacing:-.025em}
.sub{color:var(--mu);margin:0 0 22px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.topacts{display:flex;gap:8px;flex-wrap:wrap}
.bar{margin-bottom:18px}
input{width:100%;padding:9px 12px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
input:focus{outline:2px solid var(--mu);outline-offset:1px}
::placeholder{color:var(--mu)}
.count{color:var(--mu);font-size:.88rem;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.cardhead{display:flex;gap:12px;align-items:center}
.icon{width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:9px;background:var(--chip);color:var(--tx)}
.icon.github{color:var(--tx)}
.icon.site{color:var(--site)}
.icon svg{width:21px;height:21px;fill:currentColor}
.icon.site svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card h2{margin:0;font-size:1.05rem;font-weight:600;letter-spacing:-.01em;overflow-wrap:anywhere}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--mu);font-size:.78rem}
.pill{font-size:.7rem;font-weight:600;letter-spacing:.02em;text-transform:uppercase;padding:1px 8px;border-radius:99px;background:var(--chip);color:var(--tx)}
.pill.github{background:#1f242c;color:#e6edf3}
.pill.site{background:#17263a;color:#93c5fd}
.url{color:var(--mu);font-size:.84rem;overflow-wrap:anywhere;text-decoration:none}
.url:hover{color:var(--tx);text-decoration:underline}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:4px}
.tag{color:var(--mu);font-size:.75rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--mu);padding:40px 0;text-align:center}
button.primary,button.secondary{border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:8px 14px;border-radius:6px;font:inherit;font-size:.88rem;font-weight:600;cursor:pointer}
button.primary{background:var(--ac);color:var(--onac);border-color:var(--ac)}
button.primary:hover{opacity:.9}
button.secondary:hover{background:var(--chip)}
button:disabled{opacity:.5;cursor:not-allowed}
.status{color:var(--mu);font-size:.85rem;margin:-6px 0 12px;min-height:1.2em}
.status.err{color:#fca5a5}
.ops{display:flex;gap:6px}
.ops button{border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-size:.78rem;padding:4px 9px;border-radius:6px;cursor:pointer}
.ops button:hover{background:var(--chip)}
.ops button.del{color:#fca5a5}
.editor{border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);max-width:560px;width:calc(100% - 32px);padding:20px}
.editor::backdrop{background:rgba(0,0,0,.7)}
.editor form{display:grid;gap:10px}
.editor h2{margin:0 0 4px;font-size:1.15rem}
.editor label{display:grid;gap:4px;font-size:.85rem;color:var(--mu)}
.editor .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.detected{font-size:.82rem;color:var(--mu);min-height:1.2em}
.formerr{font-size:.82rem;color:#fca5a5;min-height:1.2em}
</style></head>
<body><main>
<div class="top"><div><h1>Cortex</h1><p class="sub">Agent skills, CLIs and open-source tools. One name, one link.</p></div><div class="topacts"><button class="secondary" id="auth" type="button">Log in</button><button class="secondary" id="export" type="button">Export JSON</button><button class="primary" id="new" type="button" disabled>+ New link</button></div></div>
<div id="status" class="status" role="status"></div>
<div class="bar"><input id="q" type="search" placeholder="Search by name, link, or host…" aria-label="Search"></div>
<div class="count" id="count">Loading…</div><div class="grid" id="grid"></div>
</main>
<dialog id="editor" class="editor">
<form id="form">
<h2 id="editor-title">New link</h2>
<input id="f-id" type="hidden">
<label>Name <input id="f-name" required maxlength="200"></label>
<label>Link <input id="f-link" required maxlength="2000" placeholder="owner/repo or https://example.com"></label>
<div id="detected" class="detected">Detected: waiting for link</div>
<div class="actions"><button id="cancel" class="secondary" type="button">Cancel</button><button id="save" class="primary" type="submit">Save</button></div>
</form>
</dialog>
<dialog id="login" class="editor">
<form id="login-form">
<h2>Admin login</h2>
<label>Password <input id="f-password" type="password" required autocomplete="current-password"></label>
<div id="login-error" class="formerr"></div>
<div class="actions"><button id="login-cancel" class="secondary" type="button">Cancel</button><button class="primary" type="submit">Log in</button></div>
</form>
</dialog>

var rows=[],q="",auth={enabled:false,authenticated:false},editable=false;
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function prepare(value){
 var link=String(value||"").trim();
 if(/^[^\s/]+\/[^\s/]+$/.test(link))link="https://github.com/"+link;
 else if(!/^https?:\/\//i.test(link))link="https://"+link;
 var host="",kind="link";
 try{var u=new URL(link);host=u.hostname.toLowerCase().replace(/^www\./,"");kind=(host==="github.com"||host==="gist.github.com")?"github":"site"}catch(e){}
 return{link:link,host:host,kind:kind};
}
function icon(kind){
 if(kind==="github")return'<svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>';
 return'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9S14.5 18.4 12 21c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>';
}
function say(msg,err){var s=$("status");s.textContent=msg||"";s.className="status"+(err?" err":"")}
function api(path,opt){
 return fetch(path,Object.assign({headers:{"Content-Type":"application/json"}},opt||{})).then(function(res){
  return res.json().catch(function(){return {}}).then(function(data){
   if(!res.ok)throw new Error(data.error||("Request failed ("+res.status+")"));
   return data;
  });
 });
}
function authStatus(){
 return api("/api/auth/status").then(function(data){auth=data||auth}).catch(function(){auth={enabled:false,authenticated:false}}).then(function(){
  editable=Boolean(auth.authenticated);
 });
}
function load(){
 var apiOk=true;
 return api("/api/tools").then(function(data){rows=data||[];say("")}).catch(function(e){
  apiOk=false;rows=(window.TOOLS||[]).map(function(r,i){r=Object.assign({},r);r.id=-(i+1);return r});
  editable=false;say("API unavailable. Read-only seed data. "+e.message,true);
 }).then(authStatus).then(function(){
  if(apiOk&&auth.enabled&&!auth.authenticated)say("Read only. Log in to add, edit, or delete links.");
  render();
 });
}
function render(){
 var b=$("auth");b.textContent=auth.authenticated?"Log out":"Log in";b.disabled=!auth.enabled;b.title=auth.enabled?"":"ADMIN_PASSWORD is not configured";
 $("new").disabled=!editable;
 var l=rows.filter(function(r){var p=prepare(r.link);return(r.name+" "+r.link+" "+p.host).toLowerCase().indexOf(q)>-1});
 $("count").textContent=l.length+" of "+rows.length+" links";
 var g=$("grid");g.innerHTML=l.length?"":'<div class="empty">No matches.</div>';
 l.forEach(function(r){var p=prepare(r.link),k=p.kind==="github"?"github":"site",c=document.createElement("article");c.className="card";
  var ops=editable?'<div class="ops"><button type="button" data-act="edit">Edit</button><button type="button" class="del" data-act="del">Delete</button></div>':"";
  c.innerHTML='<div class="cardhead"><span class="icon '+k+'" aria-hidden="true">'+icon(k)+'</span><div><h2>'+esc(r.name)+'</h2><div class="meta"><span class="pill '+k+'">'+(k==="github"?"GitHub repo":"Custom site")+'</span><span>'+esc(p.host||"unknown host")+'</span></div></div></div><a class="url" href="'+esc(p.link)+'" target="_blank" rel="noopener">'+esc(p.link)+' ↗</a><div class="foot"><span class="tag">'+esc(k==="github"?"github":"website")+'</span>'+ops+'</div>';
  var edit=c.querySelector('[data-act="edit"]'),del=c.querySelector('[data-act="del"]');
  if(edit)edit.onclick=function(){openEditor(r)};
  if(del)del.onclick=function(){removeEntry(r)};
  g.appendChild(c)});
}
function updateDetected(){
 var p=prepare($("f-link").value);
 $("detected").textContent=p.link?("Detected: "+(p.kind==="github"?"GitHub repo":"Custom site")+" ("+(p.host||"invalid URL")+")"):"Detected: waiting for link";
}
function openLogin(){
 $("login-error").textContent="";$("f-password").value="";
 if(!$("login").open)$("login").showModal();
 $("f-password").focus();
}
function openEditor(r){
 $("editor-title").textContent=r?"Edit link":"New link";
 $("f-id").value=r?r.id:"";
 $("f-name").value=r?r.name||"":"";
 $("f-link").value=r?r.link||"":"";
 updateDetected();
 if(!$("editor").open)$("editor").showModal();
 $("f-name").focus();
}
function closeEditor(){$("editor").close()}
function collect(){return{name:$("f-name").value.trim(),link:$("f-link").value.trim()}}
function removeEntry(r){
 if(!window.confirm("Delete "+r.name+"?"))return;
 api("/api/tools/"+r.id,{method:"DELETE"}).then(load).then(function(){say("Link deleted.")}).catch(function(e){say(e.message,true)});
}
$("form").onsubmit=function(e){
 e.preventDefault();
 var id=$("f-id").value,btn=$("save");btn.disabled=true;
 api(id?"/api/tools/"+id:"/api/tools",{method:id?"PUT":"POST",body:JSON.stringify(collect())}).then(function(){closeEditor();return load()}).then(function(){say(id?"Link updated.":"Link added.")}).catch(function(e){say(e.message,true)}).then(function(){btn.disabled=false});
};
$("login-form").onsubmit=function(e){
 e.preventDefault();$("login-error").textContent="";
 var btn=e.target.querySelector('button[type="submit"]');btn.disabled=true;
 api("/api/login",{method:"POST",body:JSON.stringify({password:$("f-password").value})}).then(function(){return authStatus()}).then(function(){$("login").close();render();say("Logged in.")}).catch(function(err){$("login-error").textContent=err.message}).then(function(){btn.disabled=false});
};
$("auth").onclick=function(){
 if(auth.authenticated)api("/api/logout",{method:"POST"}).then(authStatus).then(function(){render();say("Logged out.")}).catch(function(e){say(e.message,true)});
 else openLogin();
};
$("login-cancel").onclick=function(){$("login").close()};
$("f-link").oninput=updateDetected;
$("q").oninput=function(e){q=e.target.value.toLowerCase();render()};
$("new").onclick=function(){openEditor(null)};
$("cancel").onclick=closeEditor;
$("export").onclick=function(){
 var a=document.createElement("a"),url=URL.createObjectURL(new Blob([JSON.stringify(rows,null,2)],{type:"application/json"}));
 a.href=url;a.download="cortex-links.json";a.click();URL.revokeObjectURL(url);
};
load();
</script></body></html>
